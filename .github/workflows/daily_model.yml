# GitHub Actions workflow — runs daily at 12:00am ET (5:00 UTC)
#
# Required GitHub repo secrets:
#   (none — ESPN odds API is free, no key needed)
#
# The workflow:
#   0. Updates game database (yesterday's final scores)
#   1. Marks yesterday's picks W/L
#   2. Fetches today's odds from ESPN (free, no key)
#   3. Runs the ML model → picks_today.json + picks_today.txt
#   4. Generates docs/index.html cheatsheet (served by GitHub Pages)
#   5. Commits all outputs back to the repo
#   Streamlit Cloud detects the commit and auto-refreshes the app

name: Daily Model Picks

on:
  schedule:
    # 12:00am ET = 5:00 UTC  (ESPN posts next-day odds by midnight)
    - cron: "0 5 * * *"
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit JSON + HTML back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      - name: Update game database
        run: python3 model/1c_update_recent_games.py

      - name: Mark yesterday's results
        run: python3 model/7_mark_results.py

      - name: Fetch today's odds (ESPN)
        run: python3 model/2_fetch_odds_espn.py

      - name: Generate model picks
        run: python3 model/6_predict_today.py

      - name: Generate cheatsheet website
        run: python3 model/generate_site.py

      - name: Commit all outputs to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model/picks_today.json model/picks_log.json lines_cache.json \
                  model/picks_today.txt docs/index.html || true
          git diff --staged --quiet || git commit -m "chore: daily picks + site $(date -u +%Y-%m-%d)"
          git push
