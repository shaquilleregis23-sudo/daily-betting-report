name: Daily Betting Report

on:
  schedule:
    - cron: "0 13 * * *"   # 9am ET (UTC-4 during EDT)
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run betting report
        id: report
        run: |
          OUTPUT=$(python3 sports_betting_daily.py)
          echo "REPORT_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Email report via Brevo
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os

          output = """${{ steps.report.outputs.REPORT_OUTPUT }}"""
          html = "<pre style='font-family:monospace;font-size:14px;line-height:1.7;background:#0d0d0d;color:#e8e8e8;padding:24px;border-radius:8px'>" + output.replace("<","&lt;").replace(">","&gt;") + "</pre>"

          payload = json.dumps({
              "sender": {"name": "Betting Report", "email": "shaqr@nychvacpro.com"},
              "to": [
                  {"email": "shaqr@nychvacpro.com", "name": "Shaquille"},
                  {"email": "shaquilleregis23@gmail.com", "name": "Shaquille"}
              ],
              "subject": f"Daily Betting Report — NBA + MLB",
              "htmlContent": html
          }).encode()

          req = urllib.request.Request(
              "https://api.brevo.com/v3/smtp/email",
              data=payload,
              headers={
                  "api-key": os.environ["BREVO_API_KEY"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          resp = urllib.request.urlopen(req)
          print(f"Email sent: {resp.status}")
          PYEOF
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

