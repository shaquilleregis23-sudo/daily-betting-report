name: Daily Betting Report

on:
  schedule:
    - cron: "0 13 * * *"   # 9am ET (UTC-4 during EDT)
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run betting report and email via Gmail
        run: |
          python3 - <<'PYEOF'
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          import subprocess

          result = subprocess.run(
              ["python3", "sports_betting_daily.py"],
              capture_output=True, text=True
          )
          output = result.stdout

          html = (
              "<pre style='font-family:monospace;font-size:14px;line-height:1.7;"
              "background:#0d0d0d;color:#e8e8e8;padding:24px;border-radius:8px'>"
              + output.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              + "</pre>"
          )

          msg = MIMEMultipart("alternative")
          msg["Subject"] = "Daily Betting Report — NBA + MLB"
          msg["From"] = "shaquilleregis23@gmail.com"
          msg["To"] = "shaquilleregis23@gmail.com, shaqr@nychvacpro.com"
          msg.attach(MIMEText(output, "plain"))
          msg.attach(MIMEText(html, "html"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login("shaquilleregis23@gmail.com", os.environ["GMAIL_APP_PASSWORD"])
              smtp.sendmail(
                  "shaquilleregis23@gmail.com",
                  ["shaquilleregis23@gmail.com", "shaqr@nychvacpro.com"],
                  msg.as_string()
              )
          print("Email sent via Gmail.")
          PYEOF
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

